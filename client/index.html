<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inheritance</title>
    <link rel="icon" href="data:," />
    <style>
      /* Shown while the game downloads and starts (main.ts removes it); inline so it paints at once. */
      #boot { position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #1b1410; color: #f1e3c2; font: 16px/1.4 Georgia, 'Times New Roman', serif; transition: opacity 0.4s; }
      #boot.gone { opacity: 0; pointer-events: none; }
      #boot h1 { margin: 0; font-size: 44px; font-weight: normal; letter-spacing: 0.04em; color: #d6b25a; }
      #boot .line { color: #b9a98a; font-style: italic; }
      #boot .dots span { display: inline-block; width: 8px; height: 8px; margin: 0 4px; border-radius: 50%; background: #d6b25a; animation: boot-dot 1.2s infinite ease-in-out; }
      #boot .dots span:nth-child(2) { animation-delay: 0.2s; }
      #boot .dots span:nth-child(3) { animation-delay: 0.4s; }
      #boot .err { max-width: 520px; padding: 0 16px; text-align: center; color: #f0a08a; }
      @keyframes boot-dot { 0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1); } }
      @media (prefers-reduced-motion: reduce) { #boot .dots span { animation: none; opacity: 0.7; } }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite">
      <h1>Inheritance</h1>
      <div class="line">Nana is putting the kettle on…</div>
      <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
    <div id="app">
      <div id="stage"></div>
      <div id="labels"></div>
      <div id="hud"></div>
      <div id="overlay"></div>
      <div id="screens"></div>
    </div>
    <noscript>Inheritance needs JavaScript and WebGL.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
